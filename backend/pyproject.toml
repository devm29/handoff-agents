[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "handoff"
version = "0.1.0"
description = "Durable multi-agent vendor due-diligence with human-in-the-loop approvals"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.11",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary,pool]>=3.2",
  "mcp>=2.3,<3",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "sse-starlette>=2.1",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
handoff = "handoff.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/handoff"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "PIE", "RET", "TC"]
# N818: the error taxonomy names (PolicyViolation, BudgetExceeded) are part of the product vocabulary.
ignore = ["TC001", "TC002", "TC003", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018", "ASYNC110"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["postgres: needs a reachable PostgreSQL (TEST_DATABASE_URL)"]
